name: Playwright Tests (Docker)
on:
    workflow_dispatch:
        inputs:
            grep:
                description: 'tests to grep'
                required: false
                default: ''
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        container:
            # Keep the tag in sync with @playwright/test in package.json
            image: mcr.microsoft.com/playwright:v1.63.0-jammy
            options: --user 1001 --ipc=host
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            # Browsers are already baked into the image, no `playwright install` needed
            - name: Run Playwright tests
              run: npx playwright test -g "${{ github.event.inputs.grep }}"
              env:
                  HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
                  HTTP_PASSWORD: ${{ secrets.HTTP_PASSWORD }}
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
